name: "Boda - RSVP y Fotos"
version: "1.25.1"
slug: "boda_rsvp_fotos"
description: "Sitio web para confirmar asistencia y compartir fotos de la boda"
url: "https://github.com/flavioteuy/boda-rsvp-fotos"
arch:
  - amd64
startup: application
boot: auto
init: false
# Permite publicar las estadisticas como entidades de Home Assistant (sensor.boda_datos, sensor.boda_actividad)
homeassistant_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Interfaz web del sitio de la boda"
map:
  - media:rw
options:
  admin_password: "cambiame"
  novia: "Nombre Novia"
  novio: "Nombre Novio"
  fecha_boda: "2027-01-01"
  lugar_boda: "Salón de Fiestas, Ciudad"
schema:
  admin_password: str
  novia: str
  novio: str
  fecha_boda: str
  lugar_boda: str
  ruta_admin: str?
  admin_solo_red_local: bool?
  homeassistant: bool?
  invitados_esperados: int(0,)?
