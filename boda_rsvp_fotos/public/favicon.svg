<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="oroA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8e7a8"/>
      <stop offset=".5" stop-color="#dcac3f"/>
      <stop offset="1" stop-color="#a06c1c"/>
    </linearGradient>
    <linearGradient id="oroB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdeeb8"/>
      <stop offset=".5" stop-color="#e3b548"/>
      <stop offset="1" stop-color="#ac7a24"/>
    </linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a03040"/>
      <stop offset="1" stop-color="#6b1826"/>
    </linearGradient>
    <clipPath id="cruce"><rect x="21" y="43" width="22" height="20"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fondo)"/>
  <!-- anillo izquierdo -->
  <circle cx="23" cy="39" r="14.5" fill="none" stroke="#3d0b16" stroke-opacity=".6" stroke-width="9.6"/>
  <circle cx="23" cy="39" r="14.5" fill="none" stroke="url(#oroA)" stroke-width="7.2"/>
  <!-- anillo derecho (pasa por encima arriba y por debajo abajo) -->
  <circle cx="41" cy="39" r="14.5" fill="none" stroke="#3d0b16" stroke-opacity=".6" stroke-width="9.6"/>
  <circle cx="41" cy="39" r="14.5" fill="none" stroke="url(#oroB)" stroke-width="7.2"/>
  <!-- cruce inferior: el izquierdo vuelve a pasar por encima -->
  <g clip-path="url(#cruce)">
    <circle cx="23" cy="39" r="14.5" fill="none" stroke="#3d0b16" stroke-opacity=".6" stroke-width="9.6"/>
    <circle cx="23" cy="39" r="14.5" fill="none" stroke="url(#oroA)" stroke-width="7.2"/>
  </g>
  <!-- brillos finos -->
  <path d="M12.5 33 A14.5 14.5 0 0 1 22 26.2" fill="none" stroke="#fff8dc" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M50 27.8 A14.5 14.5 0 0 1 54.4 33" fill="none" stroke="#fff8dc" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round"/>
  <!-- diamante -->
  <path d="M41 4.5 L47.5 11 L41 20 L34.5 11 Z" fill="#ffffff"/>
  <path d="M41 4.5 L47.5 11 L41 11 Z" fill="#e3edfc"/>
  <path d="M34.5 11 L41 11 L41 20 Z" fill="#b4c9e8"/>
  <path d="M41 11 L47.5 11 L41 20 Z" fill="#cfdcf2"/>
</svg>
